name: Check links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repository links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,429
            --exclude 'localhost|127\.0\.0\.1'
            './**/*.md'
            './html/**/*.html'
            './html/**/*.js'
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}
