name: Validate static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate HTML
        run: npx --yes html-validate@11.16.2 html/index.html
      - name: Check JavaScript syntax
        run: |
          node --check html/theme.js
          node --check html/machines.js
          node --check html/market-prices.js
          node --check html/i18n.js
          node --check html/app.js
      - name: Run smoke tests
        run: node --test tests/smoke.mjs
      - name: Check whitespace
        run: git diff --check
