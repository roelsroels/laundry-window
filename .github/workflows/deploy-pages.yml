name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp deployed version
        run: |
          release_version="$(sed -n 's/^[[:space:]]*version: "\([^"]*\)",[[:space:]]*$/\1/p' html/version.js)"
          test -n "$release_version"
          short_sha="${GITHUB_SHA::7}"
          printf 'window.LaundryBuild = Object.freeze({ version: "%s", environment: "production", commit: "%s", branch: "%s" });\n' \
            "$release_version" "$short_sha" "$GITHUB_REF_NAME" > html/version.js
          cache_key="$release_version-$short_sha"
          for asset in favicon.svg theme.js styles.css i18n.js machines.js market-prices.js version.js app.js; do
            sed -i "s|$asset\"|$asset?v=$cache_key\"|" html/index.html
          done
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload html web root
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
