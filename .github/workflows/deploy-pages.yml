name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Stamp deployed version
        run: |
          release_version="$(sed -n 's/^[[:space:]]*version: "\([^"]*\)",[[:space:]]*$/\1/p' html/version.js)"
          test -n "$release_version"
          short_sha="${GITHUB_SHA::7}"
          printf 'window.LaundryBuild = Object.freeze({ version: "%s", commit: "%s", branch: "%s" });\n' \
            "$release_version" "$short_sha" "$GITHUB_REF_NAME" > html/version.js
          sed -i "s|src=\"version.js\"|src=\"version.js?v=$release_version-$short_sha\"|" html/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload html web root
        uses: actions/upload-pages-artifact@v4
        with:
          path: html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
